<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="bg-the-north-face-borealis-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="packGrad-the-north-face-borealis-5" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow-the-north-face-borealis-5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid-the-north-face-borealis-5" width="24" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="24" y2="0" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="24" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="700" fill="url(#bg-the-north-face-borealis-5)"/>
  <rect width="600" height="700" fill="url(#grid-the-north-face-borealis-5)"/>

  <!-- Ambient Glow -->
  <circle cx="300" cy="370" r="230" fill="#171717" opacity="0.2" filter="blur(60px)"/>

  <!-- Top-Right Spec Badge -->
  <g transform="translate(560, 45)" text-anchor="end">
    <rect x="-95" y="-15" width="105" height="30" rx="15" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="-12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">28L EDC</text>
  </g>

  <!-- Backpack Illustration Container -->
  <g filter="url(#shadow-the-north-face-borealis-5)" transform="translate(300, 365)">
    <!-- Top Carry Handle -->
    <path d="M -55 -165 Q 0 -210 55 -165" fill="none" stroke="#374151" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Main Backpack Body -->
    <rect x="-135" y="-165" width="270" height="335" rx="46" fill="url(#packGrad-the-north-face-borealis-5)" stroke="#374151" stroke-width="3.5" opacity="0.98"/>
    
    <!-- Upper Profile Contour -->
    <path d="M -120 -80 C -60 -100, 60 -100, 120 -80" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    
    <!-- Special Brand Specific Features -->
    
        <!-- Front Bungee Cord System -->
        <path d="M -70 -60 L 70 0 L -70 60 L 70 120" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
      

    <!-- Brand Emblem / Lower Patch -->
    <rect x="-45" y="90" width="90" height="28" rx="6" fill="#09090b" stroke="#374151" stroke-width="2"/>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">THE NORTH FACE</text>

    <!-- Angle & Image Indicator Pill -->
    <g transform="translate(0, 195)">
      <rect x="-105" y="-14" width="210" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        IMAGE 5 OF 5 • STEALTH DETAIL
      </text>
    </g>
  </g>
</svg>