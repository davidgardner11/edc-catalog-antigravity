<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="bg-mystery-ranch-urban-assault-21-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="packGrad-mystery-ranch-urban-assault-21-2" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow-mystery-ranch-urban-assault-21-2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid-mystery-ranch-urban-assault-21-2" width="24" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="24" y2="0" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="24" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="700" fill="url(#bg-mystery-ranch-urban-assault-21-2)"/>
  <rect width="600" height="700" fill="url(#grid-mystery-ranch-urban-assault-21-2)"/>

  <!-- Ambient Glow -->
  <circle cx="300" cy="370" r="230" fill="#18181b" opacity="0.1" filter="blur(60px)"/>

  <!-- Top-Right Spec Badge -->
  <g transform="translate(560, 45)" text-anchor="end">
    <rect x="-95" y="-15" width="105" height="30" rx="15" fill="rgba(0,0,0,0.06)" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
    <text x="-12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0f172a">21L EDC</text>
  </g>

  <!-- Backpack Illustration Container -->
  <g filter="url(#shadow-mystery-ranch-urban-assault-21-2)" transform="translate(300, 365)">
    <!-- Top Carry Handle -->
    <path d="M -55 -165 Q 0 -210 55 -165" fill="none" stroke="#604734" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Main Backpack Body -->
    <rect x="-135" y="-165" width="270" height="335" rx="46" fill="url(#packGrad-mystery-ranch-urban-assault-21-2)" stroke="#604734" stroke-width="3.5" opacity="0.98"/>
    
    <!-- Upper Profile Contour -->
    <path d="M -120 -80 C -60 -100, 60 -100, 120 -80" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
    
    <!-- Special Brand Specific Features -->
    
        <!-- 3-ZIP Iconic Y-Zipper -->
        <path d="M 0 100 L 0 -40 L -70 -140 M 0 -40 L 70 -140" fill="none" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
        <circle cx="0" cy="-40" r="8" fill="#ea580c"/>
      

    <!-- Brand Emblem / Lower Patch -->
    <rect x="-45" y="90" width="90" height="28" rx="6" fill="#ffffff" stroke="#604734" stroke-width="2"/>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#09090b" text-anchor="middle" letter-spacing="1.5">MYSTERY RANCH</text>

    <!-- Angle & Image Indicator Pill -->
    <g transform="translate(0, 195)">
      <rect x="-105" y="-14" width="210" height="28" rx="14" fill="rgba(0,0,0,0.06)" stroke="rgba(0,0,0,0.12)" stroke-width="1.5"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">
        IMAGE 2 OF 5 • STUDIO LIGHT
      </text>
    </g>
  </g>
</svg>